[project]
name = "delivery-service"
version = "0.1.0"
description = ""
authors = [
    {name = "Stepan229",email = "sskrylyv@mail.ru"}
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "fastapi (>=0.120.4,<0.121.0)",
    "uvicorn (>=0.38.0,<0.39.0)",
    "sqlalchemy (>=2.0.44,<3.0.0)",
    "pydantic (>=2.12.3,<3.0.0)",
    "psycopg2 (>=2.9.11,<3.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "alembic (>=1.17.1,<2.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "sentry-sdk (>=2.43.0,<3.0.0)",
    "starlette-exporter (>=0.23.0,<0.24.0)",
    "aiohttp (>=3.13.2,<4.0.0)",
    "apscheduler (>=3.11.1,<4.0.0)",
    "fastapi-cache2[redis] (>=0.2.2,<0.3.0)",
    "fastapi-filter (>=2.0.1,<3.0.0)",
    "typer (>=0.20.0,<0.21.0)",
    "dotenv (>=0.9.9,<0.10.0)",
]

[tool.poetry]
packages = [{include = "delivery_service", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
