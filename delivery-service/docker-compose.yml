services:
    delivery-service-app:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                - HTTP_PROXY=${HTTP_PROXY}
                - HTTPS_PROXY=${HTTPS_PROXY}
        
        ports:
            - "${API_PORT}:${API_PORT}"
        depends_on:
            - database
            - redis
        command:
            sh -c "/app/.venv/bin/python main.py run-api"

    scheduler:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                - HTTP_PROXY=${HTTP_PROXY}
                - HTTPS_PROXY=${HTTPS_PROXY}
        
        depends_on:
            - database
            - redis
        command:
            sh -c "/app/.venv/bin/python main.py run-scheduler"


    database:
        image: postgres:17.4-alpine
        ports:
            - "5434:${DB_PORT}"
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_NAME}

        volumes:
            - postgres_data:/var/lib/postgresql/data

    
    redis:
        image: redis:7.2.5-alpine
        hostname: redis
        ports:
            - "6379:${REDIS_PORT}"


volumes:
    postgres_data:
