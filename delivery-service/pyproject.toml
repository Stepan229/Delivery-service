[project]
name = "delivery-service"
version = "0.1.0"
description = ""
authors = [
    {name = "Stepan229",email = "sskrylyv@mail.ru"}
]
requires-python = ">=3.10"
dependencies = [
    "fastapi (>=0.120.4,<0.121.0)",
    "uvicorn (>=0.38.0,<0.39.0)",
    "sqlalchemy (>=2.0.44,<3.0.0)",
    "pydantic (>=2.12.3,<3.0.0)",
    "psycopg2 (>=2.9.11,<3.0.0)",
